# Server deployment of RentHelper from the image published by GitHub Actions, served at
# https://renthelper.duckdns.org.
#
# RentHelper has NO PostgreSQL of its own: it uses BoxVault's (container "boxvault-db"), with its
# own database and role. BoxVault's stack must be up first. Compose cannot wait for a container
# of another project, so if the database is not ready the app exits and "restart" retries it.
#
# --- One-time setup ------------------------------------------------------------------------
#
# 1. Database and role inside boxvault-db. Its init scripts only run on an empty volume, so this
#    is done by hand, once. Use the same long random password you put in .env as
#    RENTHELPER_DB_PASSWORD:
#
#      docker exec -i boxvault-db psql -U boxvault -d boxvault <<'SQL'
#      CREATE ROLE renthelper LOGIN PASSWORD 'the-RENTHELPER_DB_PASSWORD';
#      CREATE DATABASE renthelper OWNER renthelper;
#      -- By default any role may CONNECT to any database: keep each app in its own.
#      REVOKE CONNECT ON DATABASE renthelper FROM PUBLIC;
#      REVOKE CONNECT ON DATABASE boxvault FROM PUBLIC;
#      SQL
#
#    Flyway creates the tables on the first start of the app.
#
# 2. The subdomain renthelper.duckdns.org registered in DuckDNS and pointing to the same IP as
#    boxvault.duckdns.org. Traefik gets the certificate by itself on the first request.
#
# 3. A .env next to this file:
#
#      DOCKER_IMAGE=<docker-hub-user>/renthelper-backend:latest
#      RENTHELPER_DB_PASSWORD=<same as in step 1>
#      RENTHELPER_ADMIN_EMAIL=<panel login>
#      RENTHELPER_ADMIN_PASSWORD=<panel password, in clear; the app hashes it with BCrypt>
#      RENTHELPER_CLAVE_MAESTRA=<openssl rand -hex 32; never change it, see below>
#
#    RENTHELPER_CLAVE_MAESTRA encrypts the secrets saved from the panel (API keys, SMTP
#    password, Telegram token). If you lose it they cannot be recovered and must be typed again.
#    Keep a copy outside the server: it is NOT in the database backup, on purpose.
#
#    LLM providers, SMTP and Telegram are configured in the panel (Ajustes). The optional
#    variables further down are only read on the very first start, to import them.
#
# 4. Keep this file and ./deploy/backup/*.sh together in the deployment directory, then:
#
#      docker compose pull && docker compose up -d
#
# --- Networks ------------------------------------------------------------------------------
#
# traefik-net: created by the Traefik stack, as for BoxVault.
# boxvault-net: BoxVault's internal network, where boxvault-db lives. Compose prefixes it with
# BoxVault's project name (its directory name), so the real name is usually
# "boxvault_boxvault-net". Check it with `docker network ls` and, if it differs, set
# BOXVAULT_NETWORK in .env.
#
# Updates: BoxVault's watchtower runs with --label-enable and watches every container on the
# host carrying the label, not only its own project's, so it also redeploys this app when a new
# image is published. No second watchtower is needed.
services:
  renthelper:
    image: ${DOCKER_IMAGE:?set DOCKER_IMAGE in .env}
    container_name: renthelper
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://boxvault-db:5432/${RENTHELPER_DB:-renthelper}
      SPRING_DATASOURCE_USERNAME: ${RENTHELPER_DB_USER:-renthelper}
      SPRING_DATASOURCE_PASSWORD: ${RENTHELPER_DB_PASSWORD:?set RENTHELPER_DB_PASSWORD in .env}
      RENTHELPER_URL_PUBLICA: https://renthelper.duckdns.org
      RENTHELPER_ADMIN_EMAIL: ${RENTHELPER_ADMIN_EMAIL:?set RENTHELPER_ADMIN_EMAIL in .env}
      # One of the two. The hash starts with $2y$...: write each $ as $$ in .env, or Compose
      # takes it for a variable.
      RENTHELPER_ADMIN_PASSWORD: ${RENTHELPER_ADMIN_PASSWORD:-}
      RENTHELPER_ADMIN_PASSWORD_HASH: ${RENTHELPER_ADMIN_PASSWORD_HASH:-}
      RENTHELPER_CLAVE_MAESTRA: ${RENTHELPER_CLAVE_MAESTRA:?set RENTHELPER_CLAVE_MAESTRA in .env}
      # Optional, only read on the first start (see step 3). Afterwards, the panel.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CORREO_REMITENTE: ${CORREO_REMITENTE:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Native images accept the usual heap flags; far less is needed than on the JVM
      JAVA_OPTS: "-Xmx384m"
      TZ: Europe/Madrid
    # No published port: the only way in is https://renthelper.duckdns.org through Traefik.
    #
    # --- Attack surface, route by route (Traefik v3 label names) -------------------------------
    #
    # One router per kind of traffic, each with its own limits. Traefik picks the router with the
    # highest priority whose rule matches:
    #
    #   100 /actuator/**                     blocked from outside (the healthcheck is internal)
    #    95 POST /api/admin/login            brute-force limit: 3 at once, 1/minute, 10/hour per IP
    #    90 /admin/**, /api/admin/**         bigger bodies (the panel edits form definitions)
    #    80 POST .../anuncios/{slug}/candidaturas   new application: the strictest public limit
    #    70 /api/publico/**                  the form's API
    #     1 everything else                  pages and static files
    #
    # No IP allowlist anywhere. The form is public on purpose: candidates arrive from idealista
    # with any IP, often from a phone behind the carrier's NAT, where many people share one IP.
    # The panel is used from the phone and away from home too, so its lock is the password plus
    # the login limit. The limits are generous per IP: they stop floods and scripts, not people. The app applies
    # its own, finer limits behind these (FiltroRateLimit: 10 new applications/hour and
    # 90 requests/minute per IP) and answers them with a readable message.
    #
    # All the limits count per client IP as Traefik sees it, so check once that it sees the real
    # ones. Open https://renthelper.duckdns.org/api/csrf from your phone on 4G and look at the
    # client address in Traefik's access log (accessLog must be enabled). It must be the phone's
    # public IP. If every request comes from the same 172.x address, Docker is proxying the
    # connections: every visitor shares one bucket, and the login limit blocks everyone at once.
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "true"
      # Two networks: tell Traefik which one reaches the app.
      traefik.docker.network: "traefik-net"
      traefik.http.services.renthelper.loadbalancer.server.port: "8080"

      # --- Middlewares ---------------------------------------------------------------------

      # Security headers. The app already sends CSP, X-Frame-Options and nosniff; this adds
      # HSTS and keeps the candidate's token (it is in the URL) out of the Referer header.
      traefik.http.middlewares.renthelper-cabeceras.headers.stsSeconds: "31536000"
      traefik.http.middlewares.renthelper-cabeceras.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.renthelper-cabeceras.headers.frameDeny: "true"
      traefik.http.middlewares.renthelper-cabeceras.headers.referrerPolicy: "no-referrer"
      traefik.http.middlewares.renthelper-cabeceras.headers.permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=()"
      traefik.http.middlewares.renthelper-cabeceras.headers.customResponseHeaders.X-Robots-Tag: "noindex, nofollow"

      # At most 20 requests in flight per IP: slow, piled-up requests cannot tie up the server.
      # ipstrategy.depth=0 means "the connection's IP": without it, inFlightReq counts per host
      # name, i.e. one bucket for the whole world.
      traefik.http.middlewares.renthelper-concurrencia.inflightreq.amount: "20"
      traefik.http.middlewares.renthelper-concurrencia.inflightreq.sourcecriterion.ipstrategy.depth: "0"

      # Request bodies. The form's answers are a few KB of JSON; the panel edits form and rubric
      # definitions, which are bigger. Anything above is rejected (413) before reaching the app.
      traefik.http.middlewares.renthelper-cuerpo-publico.buffering.maxRequestBodyBytes: "131072"
      traefik.http.middlewares.renthelper-cuerpo-admin.buffering.maxRequestBodyBytes: "2097152"

      # Rate limits per IP (token bucket: "average" per "period", with "burst" in reserve).
      # Pages and static files: loading the form or the panel is a handful of requests.
      traefik.http.middlewares.renthelper-limite-general.ratelimit.average: "60"
      traefik.http.middlewares.renthelper-limite-general.ratelimit.period: "1m"
      traefik.http.middlewares.renthelper-limite-general.ratelimit.burst: "120"
      # The form's API: saving each step is one request.
      traefik.http.middlewares.renthelper-limite-api.ratelimit.average: "90"
      traefik.http.middlewares.renthelper-limite-api.ratelimit.period: "1m"
      traefik.http.middlewares.renthelper-limite-api.ratelimit.burst: "30"
      # New applications: 5 at once, then one every 3 minutes. Looser than the app's own limit
      # (10/hour), so a real person hits the app's message first; this stops a script.
      traefik.http.middlewares.renthelper-limite-alta.ratelimit.average: "20"
      traefik.http.middlewares.renthelper-limite-alta.ratelimit.period: "1h"
      traefik.http.middlewares.renthelper-limite-alta.ratelimit.burst: "5"
      # Panel login. The panel is reachable from anywhere (phone, away from home), so the
      # password is the only lock and guessing it has to be slow. Two buckets on the same route:
      # 3 attempts at once, then one a minute, and never more than 10 in an hour. That is under
      # 240 guesses a day per IP, against a long random password.
      traefik.http.middlewares.renthelper-limite-login.ratelimit.average: "1"
      traefik.http.middlewares.renthelper-limite-login.ratelimit.period: "1m"
      traefik.http.middlewares.renthelper-limite-login.ratelimit.burst: "3"
      traefik.http.middlewares.renthelper-limite-login-hora.ratelimit.average: "10"
      traefik.http.middlewares.renthelper-limite-login-hora.ratelimit.period: "1h"
      traefik.http.middlewares.renthelper-limite-login-hora.ratelimit.burst: "10"

      # Nobody: /actuator is only for the healthcheck, which runs inside the container.
      traefik.http.middlewares.renthelper-nadie.ipallowlist.sourcerange: "127.0.0.1/32"

      # What every route gets.
      traefik.http.middlewares.renthelper-base.chain.middlewares: "renthelper-cabeceras,renthelper-concurrencia"

      # --- Routers -------------------------------------------------------------------------

      traefik.http.routers.renthelper-actuator.rule: "Host(`renthelper.duckdns.org`) && PathPrefix(`/actuator`)"
      traefik.http.routers.renthelper-actuator.priority: "100"
      traefik.http.routers.renthelper-actuator.middlewares: "renthelper-nadie"
      traefik.http.routers.renthelper-actuator.entrypoints: "websecure"
      traefik.http.routers.renthelper-actuator.tls.certresolver: "letsencrypt"

      traefik.http.routers.renthelper-login.rule: "Host(`renthelper.duckdns.org`) && Method(`POST`) && Path(`/api/admin/login`)"
      traefik.http.routers.renthelper-login.priority: "95"
      traefik.http.routers.renthelper-login.middlewares: "renthelper-limite-login,renthelper-limite-login-hora,renthelper-cuerpo-publico,renthelper-base"
      traefik.http.routers.renthelper-login.entrypoints: "websecure"
      traefik.http.routers.renthelper-login.tls.certresolver: "letsencrypt"

      traefik.http.routers.renthelper-admin.rule: "Host(`renthelper.duckdns.org`) && (PathPrefix(`/admin`) || PathPrefix(`/api/admin`))"
      traefik.http.routers.renthelper-admin.priority: "90"
      traefik.http.routers.renthelper-admin.middlewares: "renthelper-limite-general,renthelper-cuerpo-admin,renthelper-base"
      traefik.http.routers.renthelper-admin.entrypoints: "websecure"
      traefik.http.routers.renthelper-admin.tls.certresolver: "letsencrypt"

      traefik.http.routers.renthelper-alta.rule: "Host(`renthelper.duckdns.org`) && Method(`POST`) && PathRegexp(`^/api/publico/anuncios/[^/]+/candidaturas$`)"
      traefik.http.routers.renthelper-alta.priority: "80"
      traefik.http.routers.renthelper-alta.middlewares: "renthelper-limite-alta,renthelper-cuerpo-publico,renthelper-base"
      traefik.http.routers.renthelper-alta.entrypoints: "websecure"
      traefik.http.routers.renthelper-alta.tls.certresolver: "letsencrypt"

      traefik.http.routers.renthelper-api.rule: "Host(`renthelper.duckdns.org`) && PathPrefix(`/api/publico`)"
      traefik.http.routers.renthelper-api.priority: "70"
      traefik.http.routers.renthelper-api.middlewares: "renthelper-limite-api,renthelper-cuerpo-publico,renthelper-base"
      traefik.http.routers.renthelper-api.entrypoints: "websecure"
      traefik.http.routers.renthelper-api.tls.certresolver: "letsencrypt"

      # Pages and static files, plus /api/csrf, which the panel needs before logging in.
      traefik.http.routers.renthelper-https.rule: "Host(`renthelper.duckdns.org`)"
      traefik.http.routers.renthelper-https.priority: "1"
      traefik.http.routers.renthelper-https.middlewares: "renthelper-limite-general,renthelper-cuerpo-publico,renthelper-base"
      traefik.http.routers.renthelper-https.entrypoints: "websecure"
      traefik.http.routers.renthelper-https.tls.certresolver: "letsencrypt"
    restart: unless-stopped
    # traefik-net to be reachable by Traefik, boxvault-net to reach the database.
    networks: [traefik-net, boxvault-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Nightly dump of the renthelper database in ${RENTHELPER_BACKUP_DIR}, deleting the ones older
  # than ${BACKUP_KEEP_DAYS} days. BoxVault's backup only dumps its own database.
  #
  # Same image as boxvault-db: pg_dump must be the same version as the server or newer. If
  # BoxVault's PostgreSQL is upgraded, upgrade this tag with it.
  backup:
    image: postgres:18.6-alpine
    container_name: renthelper-backup
    environment:
      POSTGRES_HOST: boxvault-db
      POSTGRES_DB: ${RENTHELPER_DB:-renthelper}
      POSTGRES_USER: ${RENTHELPER_DB_USER:-renthelper}
      POSTGRES_PASSWORD: ${RENTHELPER_DB_PASSWORD:?set RENTHELPER_DB_PASSWORD in .env}
      # 15 minutes after BoxVault's, so the two dumps don't compete for the disk.
      BACKUP_CRON: ${BACKUP_CRON:-45 3 * * *}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      # "true" makes a copy right at start-up: handy the first time, to check the mounts.
      BACKUP_ON_START: ${BACKUP_ON_START:-false}
      TZ: Europe/Madrid
    volumes:
      - ./deploy/backup:/opt/backup:ro
      # Point this at a disk other than the data one, or a network share, if you can.
      - ${RENTHELPER_BACKUP_DIR:-./backups}:/backups
    entrypoint: ["sh", "/opt/backup/entrypoint.sh"]
    restart: unless-stopped
    networks: [boxvault-net]

networks:
  # Created by the Traefik stack; this project only joins it.
  traefik-net:
    external: true
  # BoxVault's internal network, where boxvault-db lives (see "Networks" above).
  boxvault-net:
    external: true
    name: ${BOXVAULT_NETWORK:-boxvault_boxvault-net}
