# Desarrollo contra el Postgres real, con las mismas migraciones que producción.
#
#   docker compose -f docker-compose.dev.yml up -d
#   cd backend && ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev-pg
#
# Es el perfil por el que hay que pasar antes de desplegar. H2 y Postgres difieren justo en lo
# que más usa este proyecto —JSONB, arrays de texto y el índice único parcial del teléfono—, así
# que un fallo de mapeo puede no aparecer nunca en local con H2.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/renthelper
    username: renthelper
    password: renthelper

  jpa:
    # Aquí sí: valida que las entidades cuadran con lo que crearon las migraciones. Es la
    # comprobación que H2 no puede darte.
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

renthelper:
  url-publica: http://localhost:5173
  admin:
    email: admin@local
    password: renthelper
  sinteticas-por-defecto: true
  outbox:
    intervalo-ms: 5000
    lote: 1
  rate-limit:
    altas-por-ip-hora: 200
    peticiones-por-ip-minuto: 1000

logging:
  level:
    es.agata.renthelper: INFO
