# Perfil de desarrollo local, sobre H2.
#
#   cd backend && ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#   cd frontend && npm run dev
#
# El formulario se abre en http://localhost:5173/c/demo2026 y el panel en /admin.
# No hace falta Docker ni Postgres.
#
# OJO: H2 y Postgres NO son equivalentes en lo que más usa este proyecto (JSONB, arrays y el
# índice único parcial del teléfono). Antes de desplegar, pasa una vez por el perfil `dev-pg`,
# que levanta el Postgres real con las mismas migraciones que producción.
spring:
  datasource:
    # En fichero, no en memoria: si no, cada reinicio te obliga a rellenar el formulario otra vez.
    url: jdbc:h2:file:./data/renthelper-dev;AUTO_SERVER=TRUE
    username: sa
    password: ''
    driver-class-name: org.h2.Driver

  jpa:
    # El esquema lo genera Hibernate desde las entidades: las migraciones son de Postgres.
    hibernate:
      ddl-auto: update
    # Sin SQL en consola: en un arranque con sembrador son cientos de líneas que tapan las
    # trazas de negocio. Para depurar una consulta puntual, `show-sql: true` aquí y listo.
    show-sql: false

  flyway:
    enabled: false

  h2:
    console:
      enabled: true
      path: /h2-console

renthelper:
  # El frontend lo sirve Vite en el 5173 y llega al backend por su proxy: los enlaces que
  # genera la aplicación tienen que apuntar ahí, no al 8080.
  url-publica: http://localhost:5173

  admin:
    # Fijas y literales a propósito: en local el acceso al panel siempre es el mismo, aunque
    # tengas un .env con tus credenciales de producción. Al ser un documento de perfil, esto
    # tiene precedencia sobre application.yml y sobre el .env que este importa.
    email: admin@local
    # En claro: el arranque la cifra con BCrypt. En producción va en el .env del servidor.
    password: renthelper

  # Todo lo que crees en local es inventado, así que se marca como sintético. Eso permite que
  # el tier gratuito de Gemini lo evalúe sin tocar la salvaguarda de `apto-datos-reales`.
  sinteticas-por-defecto: true

  outbox:
    # Más ágil para ver el resultado sin esperar. Ojo si usas el tier gratuito de Gemini: si
    # encadenas muchos envíos seguidos puedes chocar con el límite por minuto.
    intervalo-ms: 5000
    lote: 1

  rate-limit:
    # Recargar el formulario veinte veces seguidas es normal desarrollando.
    altas-por-ip-hora: 200
    peticiones-por-ip-minuto: 1000

  telegram:
    # Sin token, ClienteTelegram escribe el mensaje en el log en vez de enviarlo: se ve el
    # formato del digest sin dar de alta un bot.
    digest-cron: '0 */2 * * * *'

logging:
  level:
    es.agata.renthelper: INFO
